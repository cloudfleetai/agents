name: Validate Plugin

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Validate plugin
        run: claude plugin validate .

      - name: Manifest versions match
        run: |
          versions=$(jq -r '.version' .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json .kiro-power/plugin.json
                     jq -r '.plugins[] | select(.name == "cloudfleet") | .version' .claude-plugin/marketplace.json)
          echo "$versions"
          [ "$(printf '%s\n' "$versions" | sort -u | wc -l)" -eq 1 ]

  test-hooks:
    name: Test hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feedback hook
        run: scripts/test-feedback-hook

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint skill files
        run: markdownlint 'skills/**/*.md' --config .markdownlint.json
